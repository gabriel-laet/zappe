[package]
name = "zappe"
version = "0.1.0"
edition = "2021"
rust-version = "1.88"
description = "Personal living-room launcher: Qt6 HUD + zappe-owned Chrome via CDP"
license = "MIT OR Apache-2.0"
repository = "https://github.com/gabriel-laet/zappe"
readme = "README.md"
build = "build.rs"

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive", "env"] }
chromiumoxide = "0.9"
cxx = "1.0"
cxx-qt = "0.7"
cxx-qt-lib = { version = "0.7", features = ["qt_full"] }
dirs = "6"
env_logger = "0.11"
futures = "0.3"
log = "0.4"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time"] }

[build-dependencies]
cxx-qt-build = { version = "0.7", features = ["link_qt_object_files"] }

[features]
default = []
link_qt_object_files = ["cxx-qt-build/link_qt_object_files"]

# Drop-in de exemplo. Troque YOUR_USER pelo usuário da sala e instale:
#   sudo mkdir -p /etc/systemd/system/getty@tty1.service.d
#   sudo cp packaging/appliance/tty1-autologin.conf /etc/systemd/system/getty@tty1.service.d/autologin.conf
#   sudo systemctl daemon-reload
#
# No ~/.bash_profile desse usuário:
#   if [[ "$(tty)" == /dev/tty1 ]]; then
#     exec ~/src/zappe/packaging/appliance/zappe-tty1.sh
#   fi
[Service]
ExecStart=
ExecStart=-/sbin/agetty --autologin YOUR_USER --noclear %I $TERM

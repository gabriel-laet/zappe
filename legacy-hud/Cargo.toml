[package]
name = "zappe"
version = "0.1.0"
edition = "2021"
rust-version = "1.88"
description = "Personal living-room / desktop launcher: native wgpu HUD + real Chrome via CDP"
license = "MIT OR Apache-2.0"
repository = "https://github.com/gabriel-laet/zappe"
readme = "README.md"

[dependencies]
anyhow = "1"
bytemuck = { version = "1", features = ["derive"] }
clap = { version = "4", features = ["derive", "env"] }
chromiumoxide = "0.9"
dirs = "6"
env_logger = "0.11"
futures = "0.3"
log = "0.4"
pollster = "0.4"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time"] }
winit = "0.30"
wgpu = "30"
